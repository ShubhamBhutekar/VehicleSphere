# TICKET: VEHMS-M01-T003
spring.application.name=vehicle-management-system

# --- Database connection: create this database first with `CREATE DATABASE vehms;` in psql/pgAdmin ---
spring.datasource.url=jdbc:postgresql://localhost:5432/vehms
spring.datasource.username=postgres
spring.datasource.password=CHANGE-ME
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=update lets Hibernate create/alter tables from your @Entity classes (covers T006)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Server ---
server.port=8080

# --- Swagger UI available at http://localhost:8080/swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- VEHMS-M02-T031: folder where the nightly visitor-history Excel backup is written ---
# Relative path = created next to wherever you run the jar/IDE working directory.
# Use an absolute path (e.g. C:/vehms-backups/visitors log) if you want a fixed location.
vehms.visitor-backup.directory=visitors log
